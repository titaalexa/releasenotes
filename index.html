<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>T201 — Incident Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --bg-elev:#0e0e11;
    --sidebar:#0c0c0f;
    --card:#131317;
    --card-hover:#18181d;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#f1f1f4;
    --text-dim:#9a9aa4;
    --text-faint:#65656f;
    --accent:#2fd7a8;
    --accent-dim:rgba(47,215,168,0.13);
    --accent-strong:#20b98e;
    --warn:#f0a83d;
    --warn-dim:rgba(240,168,61,0.14);
    --ok:#43cf8e;
    --ok-dim:rgba(67,207,142,0.14);
    --bad:#f0576f;
    --bad-dim:rgba(240,87,111,0.14);
    --radius:10px;
    --shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .light{
    --bg:#f4f5f7;
    --bg-elev:#ffffff;
    --sidebar:#ffffff;
    --card:#ffffff;
    --card-hover:#f6f7f9;
    --border:rgba(15,15,20,0.09);
    --border-strong:rgba(15,15,20,0.16);
    --text:#16161a;
    --text-dim:#5c5c66;
    --text-faint:#8b8b95;
    --accent:#149e79;
    --accent-dim:rgba(20,158,121,0.1);
    --accent-strong:#0f8666;
    --warn:#b3740c;
    --warn-dim:rgba(179,116,12,0.1);
    --ok:#1f9e64;
    --ok-dim:rgba(31,158,100,0.1);
    --bad:#d13a52;
    --bad-dim:rgba(209,58,82,0.1);
    --shadow: 0 12px 28px rgba(20,20,30,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #root{display:flex;min-height:100vh;width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 12px;height:100vh;position:sticky;top:0;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;}
  .brand-icon{width:28px;height:28px;border-radius:8px;background:var(--accent-dim);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-name{font-weight:800;font-size:15px;letter-spacing:0.2px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.9px;color:var(--text-faint);
    padding:14px 10px 6px 10px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-dim);
    font-size:13.5px;font-weight:500;cursor:pointer;margin:1px 0;position:relative;
  }
  .nav-item svg{flex:none;}
  .nav-item:hover{background:var(--card-hover);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;
    background:var(--accent);border-radius:0 3px 3px 0;}
  .nav-item .lock{margin-left:auto;color:var(--text-faint);}
  .nav-sub{padding-left:34px;}
  /* collapsible sidebar group (Leaves) */
  .nav-item.parent-open{color:var(--text);}
  .nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent-dim);color:var(--accent);
    font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .nav-chev{margin-left:8px;color:var(--text-faint);transition:transform .18s ease;display:inline-flex;}
  .nav-chev.open{transform:rotate(180deg);}
  .nav-item .nav-badge + .nav-chev{margin-left:8px;}
  .nav-sub-list{margin:2px 0 6px 20px;padding-left:8px;border-left:1px solid var(--border);}
  .nav-item.sub{padding:7px 10px;font-size:13px;}
  .nav-item.sub.active::before{display:none;}
  .sidebar-spacer{flex:1;}

  /* ---------- Topbar ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .topbar{
    height:60px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;
    padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg);position:relative;z-index:30;
  }
  .icon-btn{
    width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;position:relative;
  }
  .icon-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--border);}
  .badge-dot{
    position:absolute;top:1px;right:1px;background:var(--bad);color:#fff;font-size:9px;font-weight:700;
    border-radius:8px;padding:1px 4px;line-height:1.3;border:2px solid var(--bg);
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#0a0a0c;flex:none;
  }
  .role-pill{
    display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;
    background:var(--card);border:1px solid var(--border-strong);color:var(--text);font-size:13px;font-weight:600;
  }
  .role-pill:hover{border-color:var(--accent);}
  .role-pill .role-avatar{width:22px;height:22px;border-radius:50%;background:var(--accent-dim);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .role-pill .role-tag{font-size:10px;font-weight:700;letter-spacing:0.4px;color:var(--text-faint);
    text-transform:uppercase;display:block;line-height:1.3;}
  .role-pill .role-value{display:block;line-height:1.3;}
  .role-pill-wrap{position:relative;}
  .role-menu{
    position:absolute;top:calc(100% + 8px);right:0;width:250px;background:var(--card);
    border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:50;
  }
  .role-menu-label{font-size:10.5px;font-weight:700;color:var(--text-faint);letter-spacing:0.6px;padding:8px 10px 4px;}
  .role-opt{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text);
  }
  .role-opt:hover{background:var(--card-hover);}
  .role-opt.selected{background:var(--accent-dim);}
  .role-opt-icon{width:30px;height:30px;border-radius:8px;background:var(--bg-elev);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-dim);}
  .role-opt.selected .role-opt-icon{color:var(--accent);border-color:var(--accent);background:var(--accent-dim);}
  .role-opt-main{flex:1;min-width:0;}
  .role-opt-title{font-size:13px;font-weight:600;}
  .role-opt-sub{font-size:11.5px;color:var(--text-faint);}
  .role-opt-check{color:var(--accent);flex:none;}
  .notif-panel{
    position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--card);
    border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);z-index:50;overflow:hidden;
  }
  .notif-head{padding:13px 15px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;}
  .notif-item{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;gap:10px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
  .notif-text{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .notif-text b{color:var(--text);font-weight:600;}
  .notif-time{font-size:11px;color:var(--text-faint);margin-top:2px;}

  /* ---------- Content ---------- */
  .content{flex:1;overflow-y:auto;padding:28px 32px 60px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap;}
  .crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-faint);margin-bottom:8px;}
  .crumb .crumb-link{color:var(--text-dim);cursor:pointer;}
  .crumb .crumb-link:hover{color:var(--accent);}
  h1.page-title{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-0.3px;}
  .page-sub{color:var(--text-faint);font-size:13.5px;margin:0;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 16px;font-size:13.5px;
    font-weight:600;border:1px solid transparent;white-space:nowrap;
  }
  .btn-accent{background:var(--accent);color:#08201a;}
  .btn-accent:hover{background:var(--accent-strong);}
  .btn-ghost{background:var(--card);border-color:var(--border-strong);color:var(--text);}
  .btn-ghost:hover{background:var(--card-hover);}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  /* widgets */
  .widgets{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
  .widget{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
    cursor:pointer;transition:border-color .12s;
  }
  .widget:hover{border-color:var(--border-strong);}
  .widget.selected{border-color:var(--accent);}
  .widget.w-pending{background:var(--warn-dim);border-color:rgba(240,168,61,0.28);}
  .widget.w-pending .widget-value{color:var(--warn);}
  .widget.w-pending.selected{border-color:var(--warn);}
  .widget.w-approved{background:var(--ok-dim);border-color:rgba(67,207,142,0.28);}
  .widget.w-approved .widget-value{color:var(--ok);}
  .widget.w-approved.selected{border-color:var(--ok);}
  .widget.w-rejected{background:var(--bad-dim);border-color:rgba(240,87,111,0.28);}
  .widget.w-rejected .widget-value{color:var(--bad);}
  .widget.w-rejected.selected{border-color:var(--bad);}
  .widget.w-cancelled.selected{border-color:var(--text-dim);}
  .widget-label{font-size:10.5px;font-weight:700;letter-spacing:0.7px;color:var(--text-faint);margin-bottom:10px;
    display:flex;align-items:center;gap:7px;}
  .widget-label .dot{width:8px;height:8px;border-radius:50%;}
  .widget-value{font-size:28px;font-weight:800;letter-spacing:-0.5px;}
  .widget-note{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

  /* filters */
  .filter-bar{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;}
  .search-box{
    flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--border-strong);border-radius:9px;padding:8px 12px;color:var(--text-faint);
  }
  .search-box input{border:none;background:transparent;outline:none;color:var(--text);font-size:13.5px;width:100%;
    font-family:inherit;}
  select.filter-select, input.filter-date{
    background:var(--card);border:1px solid var(--border-strong);color:var(--text);border-radius:9px;
    padding:8px 10px;font-size:13px;font-family:inherit;min-width:130px;
  }
  input.filter-date{color-scheme:dark;width:100%;}
  .light input.filter-date{color-scheme:light;}
  .date-field{display:flex;flex-direction:column;gap:4px;min-width:150px;}
  .date-field-label{font-size:10px;font-weight:700;letter-spacing:0.5px;color:var(--text-faint);
    text-transform:uppercase;padding-left:1px;}
  .clear-btn{color:var(--text-faint);font-size:12.5px;font-weight:600;padding:8px 4px;white-space:nowrap;
    align-self:flex-end;}
  .clear-btn:hover{color:var(--accent);}

  /* table */
  .table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;font-weight:700;letter-spacing:0.6px;color:var(--text-faint);
    padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-elev);
  }
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--card-hover);}
  .emp-cell{cursor:pointer;}
  .emp-name{font-weight:600;color:var(--text);}
  .emp-name:hover{color:var(--accent);}
  .emp-dept{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .name-row{display:flex;align-items:center;gap:10px;}
  .mini-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#08110d;flex:none;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge.pending{background:var(--warn-dim);color:var(--warn);}
  .badge.approved{background:var(--ok-dim);color:var(--ok);}
  .badge.rejected{background:var(--bad-dim);color:var(--bad);}
  .badge.cancelled{background:rgba(154,154,164,0.16);color:var(--text-dim);}
  .link-btn{color:var(--accent);font-weight:600;font-size:12.5px;}
  .link-btn:hover{text-decoration:underline;}
  .muted{color:var(--text-faint);}
  .table-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);}
  .foot-controls{display:flex;align-items:center;gap:10px;}
  .page-btn{width:26px;height:26px;border-radius:6px;background:var(--bg-elev);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .empty-state{padding:60px 20px;text-align:center;color:var(--text-faint);}
  .empty-state svg{margin-bottom:12px;color:var(--text-faint);}
  .empty-state .empty-title{color:var(--text-dim);font-weight:600;font-size:14px;margin-bottom:4px;}

  /* tabs */
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;
    cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .tab.disabled{opacity:0.4;cursor:not-allowed;}
  .tab-count{background:var(--bg-elev);border:1px solid var(--border);color:var(--text-faint);font-size:10.5px;
    padding:1px 6px;border-radius:8px;}
  .subtabs{display:flex;gap:8px;margin-bottom:16px;}
  .subtab{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-dim);
    background:var(--card);border:1px solid var(--border);}
  .subtab.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}

  /* profile */
  .profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;margin-bottom:20px;}
  .profile-top{display:flex;align-items:center;gap:16px;}
  .profile-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;color:#08110d;flex:none;}
  .profile-name{font-size:18px;font-weight:800;}
  .status-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-dim);
    color:var(--warn);margin-left:8px;vertical-align:middle;}
  .status-chip.regular{background:var(--ok-dim);color:var(--ok);}
  .profile-title{color:var(--text-faint);font-size:13px;margin-top:3px;}
  .profile-tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:18px -22px -22px;padding:0 22px;}
  .ptab{padding:11px 14px;font-size:13px;color:var(--text-faint);border-bottom:2px solid transparent;font-weight:600;}
  .ptab.active{color:var(--text);border-bottom-color:var(--accent);}
  .ptab.inert{cursor:default;}

  .balance-note{font-size:11.5px;color:var(--text-faint);padding:12px 16px;border-top:1px solid var(--border);}
  .total-row td{background:var(--bg-elev);font-weight:800;border-top:1px solid var(--border-strong);}
  .total-row td:first-child{color:var(--text);}
  .leave-type-cell{display:flex;align-items:center;gap:11px;}
  .leave-progress-icon{width:32px;height:32px;border-radius:50%;background:var(--accent-dim);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .leave-progress-icon-sm{width:28px;height:28px;}
  .mini-progress-wrap{position:relative;display:inline-block;min-width:90px;}
  .mini-progress-wrap-cell{min-width:56px;}
  .mini-progress-track{height:5px;border-radius:3px;background:var(--border-strong);overflow:hidden;margin-top:6px;width:90px;}
  .mini-progress-wrap-cell .mini-progress-track{width:56px;}
  .mini-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .2s;}
  .mini-progress-tooltip{
    position:absolute;bottom:100%;left:0;margin-bottom:8px;
    background:var(--bg-elev);border:1px solid var(--border-strong);color:var(--text);
    font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:8px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:var(--shadow);z-index:5;
  }
  .mini-progress-wrap:hover .mini-progress-tooltip{opacity:1;}
  .avail-badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:23px;
    padding:0 9px;border-radius:999px;background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:12.5px;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(4,4,6,0.6);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--card);border:1px solid var(--border-strong);border-radius:14px;width:480px;
    max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
  .modal.modal-wide{width:620px;}
  .modal-head{position:relative;padding:18px 46px 18px 20px;border-bottom:1px solid var(--border);}
  .modal-title{font-size:17px;font-weight:800;}
  .modal-subtitle{font-size:12.5px;color:var(--text-faint);margin-top:5px;line-height:1.4;}
  .modal-close{position:absolute;top:18px;right:18px;color:var(--text-faint);}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:20px;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{color:var(--text-faint);}
  .detail-value{font-weight:600;text-align:right;}
  .form-group{margin-bottom:16px;}
  .form-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  .form-input,.form-select,.form-textarea{
    width:100%;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:9px;
    padding:9px 11px;color:var(--text);font-size:13.5px;font-family:inherit;
  }
  .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);}
  .form-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .form-textarea{resize:vertical;min-height:70px;}
  .input-error{border-color:var(--bad) !important;box-shadow:0 0 0 3px var(--bad-dim);}
  .form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .date-input-wrap{position:relative;}
  .date-input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}
  .date-input-wrap input[type="date"]{padding-left:34px;}
  .avail-box{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font-size:12.5px;color:var(--text-dim);min-height:38px;display:flex;align-items:center;
  }
  .avail-box b{color:var(--accent);font-weight:700;}
  .dropzone{
    border:1.5px dashed var(--border-strong);border-radius:10px;padding:22px 16px;text-align:center;

function submitReport(ob){const subj=$('f-subj').value,desc=txt('f-desc'),err=$('f-err');

  const pol=$('f-pol').value,w=D.wit||[],add=D.rcvx||[],rp=ob?$('f-rep').value:me(),anon=ob?!rp:$('f-anon').checked;
  const c={id:'IR-2026-00'+(nextNo++),st:'Received',lv:0,tags:/Harassment/.test(pol)?['Harassment']:[],urgent:$('f-risk').checked,filed:now(),ch:ob?$('f-ch').value+' · logged by '+nm(me()):'Filed in T201 by the reporter',rep:rp,anon,subj:[subj],wit:[...w],rcv:[],inc:fdt($('f-when').value),loc:$('f-loc').value||'Not given',policy:pol||'Not specified',desc:val('f-desc'),repF:[],repL:[],lvh:[],route:'',al:[],iv:[],notes:[],nte:[],im:[],xev:[],dec:null,nod:false,out:false,msg:'',log:[]};
  const a=take('f-desc');c.repF=a.files;c.repL=a.links;
  const pt=parties(c);c.rcv=['carla','ramon',...add,...(c.tags.length?['lorna']:[])].filter((x,i,ar)=>ar.indexOf(x)===i&&!pt.includes(x));
  lg(c,ob?'Report logged on behalf of '+(anon?'an anonymous reporter':nm(rp))+' (channel: '+$('f-ch').value+')':'Report filed in T201');c.log.push([now(),'System','Case sent to '+c.rcv.length+' receivers'+(c.urgent?'; urgent alert sent to all C&L members':'')]);
  CASES.unshift(c);D.wit=[];D.rcvx=[];S.hist.push([S.view,null]);
  if(ob){go('case',c.id);toast('Case created: '+c.id)}else{S.confirm={id:c.id,urg:c.urgent};S.view='confirm';render()}}
function pageConfirm(){const x=S.confirm;return '<div style="max-width:560px;margin:30px auto;text-align:center">'+'<div class="profile-avatar" style="margin:0 auto 14px;background:var(--ok-dim);color:var(--ok)">'+ic('check',26)+'</div><h1 class="page-title">Your report has been submitted</h1><p class="page-sub">Thank you for telling us. You did the right thing.</p><div class="card" style="margin:18px 0;text-align:left"><div class="card-b">'+kv([['Case number','<b>'+x.id+'</b>'],['Status','Received']])+'</div></div>'+(x.urg?note('Your report is marked urgent. Compliance &amp; Legal has been alerted and will contact you as soon as possible. If you are in danger, call building security at local 2222 or 911.','bad'):'')+'<div class="card" style="text-align:left;margin-bottom:16px"><div class="card-b"><b>What happens next</b><p class="page-sub" style="margin-top:6px">Compliance &amp; Legal reviews your report. They may reach out to you for more details. You don’t need to do anything until then. You’ll be told when the case is closed.</p></div></div><button class="btn btn-accent" onclick="go(\'myReports\')">Go to My Reports</button> <button class="btn btn-ghost" onclick="go(\'report\')">Report something else</button></div>'}

  (S.role==='admin'?'<div style="height:16px"></div>'+card('Super Admin access check','Super Admin in T201 gives no access to any case. Try opening a direct case link.','<button class="btn btn-ghost btn-sm" onclick="go(\'case\',\'IR-2026-0012\')">Open case link</button>'):'')}

function pageNotices(){const L=[];CASES.forEach(c=>c.nte.forEach(n=>{if(c.subj.includes(me()))L.push([c,n])}));const D=CASES.filter(c=>c.nod&&c.subj.includes(me()));

    const n=c&&c.nte.find(x=>x.id===q[1]);if(n)return '<div class="nw">'+cr('Notice to Explain')+ntDetail(c,n)+'</div>'}
  const row=(t,pill,sub,k)=>'<div class="nrow" onclick="S.ntv=\''+k+'\';render()"><span class="nico">'+ic('file',16)+'</span><div style="flex:1;min-width:0"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>'+t+'</b>'+pill+'</div><div class="muted" style="font-size:12.5px;margin-top:3px;font-family:ui-monospace,monospace">'+sub+'</div></div><span class="nchev">›</span></div>';
  const rows=L.map(x=>{const c=x[0],n=x[1],w=n.st==='Awaiting response',r=n.st==='Responded';return row('Notice to Explain','<span class="badge '+(w?'pending':r?'approved':'cancelled')+'">'+(w?ic('clock',11)+' Awaiting your response':r?ic('check',11)+' Responded':'Lapsed')+'</span>',c.id+' · '+(w?'Respond by '+fdt(n.dl):r?'Response submitted':'Response period ended '+fdt(n.dl)),c.id+'|'+n.id)}).concat(D.map(c=>row('Notice of Decision','<span class="badge cancelled">'+ic('eye',11)+' Read only</span>',c.id+' · Decision issued',c.id+'|dec'))).join('');
  return head('My Notices','Notices from Compliance &amp; Legal. Only you can see them here.')+(rows?'<div class="card" style="overflow:hidden">'+rows+'</div>':'<div class="table-card">'+empty('No notices')+'</div>')}
function ntDetail(c,n){const first=nm(me()).split(' ')[0],tag=(t,i)=>'<span class="badge cancelled">'+ic(i,11)+' '+t+'</span>';
  const meta=t=>'<div class="muted" style="font-family:ui-monospace,monospace;font-size:12.5px;margin:6px 0 16px">'+t+'</div>';
  const kvs=(a,b)=>'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px">'+[a,b].map(x=>'<div><div class="muted" style="font-size:12px">'+x[0]+'</div><b style="font-size:13.5px">'+x[1]+'</b></div>').join('')+'</div>';
  const sign='<p style="margin-bottom:0">Compliance &amp; Legal</p>';
  if(!n){const d=typeof c.nod==='string'?c.nod:'';
    return '<div style="display:flex;gap:8px;flex-wrap:wrap">'+tag('Confidential','lock')+tag('Read only','eye')+'</div><h1 class="page-title" style="margin-top:10px">Notice of Decision</h1>'+meta(c.id+(d?' · Issued '+esc(d):''))+'<div class="card"><div class="card-b">'+kvs(['From','Compliance &amp; Legal'],['Outcome',esc(c.dec.o)])+'<p style="margin-top:0">Dear '+esc(first)+',</p><p>Thank you for your response. After reviewing all the information, Compliance &amp; Legal reached a decision: <b>'+esc(c.dec.o)+'</b>'+(c.dec.a?' ('+esc(c.dec.a)+')':'')+'.</p><p>If you have questions, email cl@titosolutions.ph.</p>'+sign+'</div></div>'}
  const w=n.st==='Awaiting response',r=n.st==='Responded',al=n.al.map(i=>'<li>'+esc(c.al.find(a=>a.id===i).t)+'</li>').join(''),dd=dif(String(n.dl).slice(0,10)),left=dd>0?dd+' day'+(dd===1?'':'s')+' left':dd===0?'Due today':'Overdue';
  const letter='<div class="card" style="margin-top:14px"><div class="card-b">'+kvs(['From','Compliance &amp; Legal'],['Policy concerned',esc(n.pol||c.policy)])+'<p style="margin-top:0">Dear '+esc(first)+',</p>'+(n.text?'<p style="white-space:pre-wrap">'+esc(n.text)+'</p><div class="lbl" style="margin:14px 0 6px">THE CONCERNS RAISED</div><ul>'+al+'</ul>':'<p>Compliance &amp; Legal has received a concern that involves you. Before anything is decided, we’d like to hear your side. The concerns raised are:</p><ul>'+al+'</ul><p>Please send a written explanation through this page by '+fdt(n.dl)+'. You may include documents and the names of anyone who can support your account. If you’d like to talk to someone first, email cl@titosolutions.ph.</p>')+sign+'</div></div>';
  const form=w?'<div class="card" style="margin-top:14px"><div class="card-b"><b>Your response</b><div class="dropzone-hint" style="margin:2px 0 10px">Only Compliance &amp; Legal and the people reviewing this case will see it.</div>'+entry('nr-'+n.id,'Share your account of what happened, in your own words.',false)+'<div id="nerr" class="err"></div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn btn-accent" onclick="respond(\''+c.id+'\',\''+n.id+'\')">Submit response</button></div><div class="dropzone-hint" style="text-align:right;margin-top:6px">You won’t be able to edit your response after you submit it.</div></div></div>':'<div style="margin-top:14px">'+(r?note('Response submitted. Compliance &amp; Legal will read your response before any decision is made. You’ll get a notice when there’s an outcome.'):note('The response period ended on '+fdt(n.dl)+'. No response was received. Compliance &amp; Legal will continue the review with the information they have. If you have questions, email cl@titosolutions.ph.'))+'</div>';
  return '<div style="display:flex;gap:8px;flex-wrap:wrap">'+tag('Confidential','lock')+'<span class="badge '+(w?'pending':r?'approved':'cancelled')+'">'+(w?'Awaiting your response':r?'Responded':'Lapsed')+'</span></div><h1 class="page-title" style="margin-top:10px">Notice to Explain</h1>'+meta(c.id+' · Received '+n.at)+note('This notice asks for your side of what happened. <b>Nothing has been decided.</b> Your response will be read before any decision is made.','info')+'<div class="card" style="margin-top:14px"><div class="card-b" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="muted" style="font-size:11px;letter-spacing:.6px">RESPOND BY</div><b style="font-size:15px">'+fdt(n.dl)+'</b></div>'+(w?'<span class="badge pending">'+ic('clock',12)+' '+left+'</span>':'')+'</div></div>'+letter+form}

const LONG={
'POL-001':[['Why this Code exists',`<p>This Code of Conduct sets out how we treat one another, our clients, and the company’s property. It applies to every employee, whatever their position or employment status, and to interns, consultants, and contractors while they work with us. It covers the workplace, company events, and online spaces such as Teams chats and email, whenever the conduct is connected to work.</p><p>The Code is read together with the other policies in this library. Where a specific policy, for example the Safe Spaces Act policy or the Information Security policy, gives more detail, that policy applies together with this Code. If two rules seem to conflict, ask Compliance &amp; Legal before acting.</p>`,['memo','Code of Conduct reminder','','Sample of a company memorandum that introduces the Code of Conduct. Illustration only.']],['Respect and professionalism',`<p>We treat colleagues, clients, and vendors with courtesy, whatever their role, gender, age, belief, or background. Disagreement is welcome when it is raised respectfully and with the facts. Behavior that makes another person feel unsafe, humiliated, or excluded is not acceptable, even when it is described as a joke.</p><ul><li>No bullying, intimidation, or abusive language, in person or online.</li><li>No discrimination in hiring, pay, promotion, or discipline.</li><li>No retaliation against anyone who raises a concern in good faith.</li><li>Dress and behavior should suit a professional workplace and the client we are serving.</li></ul>`],['Honesty and integrity',`<p>Records must be accurate. Do not falsify timekeeping, expense claims, reports, or approvals, and do not alter a document after it has been signed. Company property, including laptops, accounts, and client data, is used for company work and returned when employment ends.</p><p>Confidential information about the company, its clients, and its people is shared only with those who need it to do their work. This duty continues after you leave the company.</p>`],['Discipline and due process',`<p>Violations of this Code may lead to discipline, from coaching and written warnings to dismissal for serious or repeated offenses. Under Philippine labor law, an employer must observe due process before disciplining an employee for a just cause. In practice this follows the twin-notice rule.</p><p>First, the employee receives a Notice to Explain that describes the act or omission and gives a reasonable chance to respond in writing, commonly at least five calendar days. Where the employee asks for it, a conference is held. Second, after considering the response, the company issues a Notice of Decision that states the outcome and its reasons. The T201 Incident Reporting module follows these steps.</p>`,['form','Notice to Explain','Sample form with response section','Sample of a notice form. Illustration only.']],['Where to ask questions',`<p>If you are unsure whether something is allowed, ask your supervisor, Human Resources, or Compliance &amp; Legal before you act. Asking early is always better than correcting a problem later.</p>`]],
'POL-002':[['What this policy covers',`<p>The Safe Spaces Act (Republic Act No. 11313) recognizes gender-based sexual harassment in streets, public spaces, online, workplaces, and schools as an offense. In the workplace, the law requires employers to prevent and address it, and to set up a Committee on Decorum and Investigation (CODI) to receive and investigate complaints. This policy explains how Tito Solutions meets those duties.</p><p>The policy protects every employee, intern, and contractor. It applies to acts by colleagues, supervisors, clients, and vendors, and it applies wherever the act happens, including online and outside work hours, when it affects a person’s work or sense of safety.</p>`,['law','REPUBLIC ACT NO. 11313','Safe Spaces Act','Sample of the first page of a Republic Act. Illustration only.']],['What counts as harassment',`<p>Gender-based sexual harassment is not limited to physical contact. It includes unwelcome remarks, gestures, messages, and advances that are about a person’s body, sex, or gender, or that are sexual in nature. A single act can be enough when it is serious, and repeated lesser acts can add up.</p><ul><li>Comments about a colleague’s appearance or body in meetings, chats, or social events.</li><li>Sexual jokes, sexual images, or sexual content sent to colleagues.</li><li>Personal messages sent late at night or after being asked to stop.</li><li>Repeated invitations or requests after a person has declined.</li><li>Stalking, following, or tracking a person online.</li><li>Threats or favors connected to a person’s job.</li></ul>`],['How to report and what happens next',`<p>Report through <b>Report an Incident</b> in T201. Compliance &amp; Legal receives every report, and reports about harassment are also shared with the CODI. You may ask that your name be hidden from receivers other than Compliance &amp; Legal. The person you name is not told about the report until a Notice to Explain is issued.</p><p>The reviewers assess the risk, decide whether protective measures are needed, and investigate. Protective measures, such as a change of schedule or reporting line, are temporary and are not a finding. The person named is given a written chance to respond before any decision is made. Both sides are told the outcome when the case is closed.</p>`,['form','Incident report','Sample intake form','Sample of an incident intake form. Illustration only.']],['Protection and penalties',`<p>No one may punish, threaten, or treat a person differently for reporting in good faith or for taking part in an investigation. Retaliation is a separate offense and is handled in the same way. A violation of this policy can lead to discipline, up to dismissal, and may also carry criminal liability under the law.</p>`]],
'POL-003':[['What is a conflict of interest',`<p>A conflict of interest exists when a personal interest, or the interest of a family member or close friend, could affect, or appear to affect, your judgment at work. It is not always wrong to have such an interest. What matters is that it is disclosed, so that the company can decide whether it can be managed.</p><p>Common examples are owning part of a vendor or competitor, hiring or supervising a relative, doing outside work for a client, or taking part in a decision that would benefit someone you are close to.</p>`,['form','Conflict of interest disclosure','Sample disclosure form','Sample of a disclosure form. Illustration only.']],['How to disclose',`<p>Tell Compliance &amp; Legal in writing as soon as you become aware of the interest, and again if it changes. The disclosure is kept confidential. Compliance &amp; Legal may ask you to step away from a decision, change your duties, or end the interest. Not disclosing a known conflict is a violation even if no harm resulted.</p>`],['Gifts and hospitality',`<p>Do not accept or give gifts, favors, or hospitality that could influence a business decision. Small items of nominal value, such as a holiday basket shared with the team, are generally fine. Cash, gift cards, travel, and anything offered while a purchasing decision is pending must be declined or declared to Compliance &amp; Legal.</p><p>Dealings with government offices need extra care. Never give or offer anything of value to a public official to obtain, speed up, or influence a permit or decision.</p>`]],
'POL-004':[['Why security matters',`<p>Our clients trust us with their information, and many of them require us to protect it by contract. Attackers usually succeed by tricking a person, not by breaking a machine, so each employee is part of the defense. This policy sets the basic rules for company devices, accounts, email, and data.</p>`,['memo','Information security reminder','','Sample of an IT security memorandum. Illustration only.']],['Accounts and devices',`<ul><li>Use your own account and a strong password. Never share your credentials, even with IT.</li><li>Turn on multi-factor authentication wherever it is offered.</li><li>Lock your screen when you step away and keep company devices updated.</li><li>Do not install software that has not been approved.</li><li>Report a lost or stolen device immediately.</li></ul>`],['Handling data',`<p>Keep client files in approved company storage. Do not send them to personal email, personal cloud drives, or messaging apps. Share files with the fewest people who need them, and use access links that expire. Be cautious with links and attachments from unknown senders, and when in doubt, forward the message to IT instead of opening it.</p>`],['Reporting an incident',`<p>If you suspect a breach, a phishing message, or a lost device, report it to IT within 24 hours. Prompt reporting limits the damage and is never held against the person who reports in good faith. Misuse of company systems may also violate the Cybercrime Prevention Act (Republic Act No. 10175) and other laws.</p>`]],
'POL-005':[['Working hours',`<p>Regular working hours are eight hours a day, with a one-hour meal break that is not counted as work time, in line with the Labor Code. Your assigned schedule is shown in T201. Schedule changes and shift swaps are filed in T201 and approved by your supervisor before they take effect.</p>`,['advisory','Labor Advisory on working hours','Rest days and overtime','Sample of a DOLE labor advisory. Illustration only.']],['Attendance and tardiness',`<p>Record your time in and out accurately through the company timekeeping system. Repeated tardiness or undertime without approval is handled under the Code of Conduct. If you will be late or absent, tell your supervisor as early as you can and file the matching request in T201.</p>`],['Overtime',`<p>Overtime must be approved in T201 before it is worked. Approved overtime is paid at the rates set by law and company policy. Work done without approval may still be paid when the company allowed it to happen, but it can lead to a conversation about planning. Employees should also take their weekly rest day.</p>`]],
'POL-006':[['Our commitment',`<p>The Data Privacy Act of 2012 (Republic Act No. 10173) protects the personal information of individuals and sets duties for organizations that handle it. Tito Solutions collects personal data about employees, applicants, and clients to run the business, and it handles that data under the principles of transparency, legitimate purpose, and proportionality.</p>`,['law','REPUBLIC ACT NO. 10173','Data Privacy Act of 2012','Sample of the first page of a Republic Act. Illustration only.']],['Your rights',`<p>You have the right to be informed about how your data is used, to access it, to correct it, to object to certain uses, to ask that it be blocked or removed when the law allows, and to seek damages if you were harmed by its misuse. Send requests to the Data Protection Officer. The company will respond within a reasonable time and tell you if a request cannot be granted and why.</p>`],['Your duties as an employee',`<ul><li>Access personal data only when your work needs it.</li><li>Do not copy personal data to personal devices or accounts.</li><li>Keep sensitive personal information, such as health, government ID numbers, and salary, strictly confidential.</li><li>Report any suspected data breach to the Data Protection Officer right away.</li></ul><p>A serious personal data breach must be reported to the National Privacy Commission within 72 hours of discovery, so speed matters.</p>`]],
'POL-007':[['Our duty and yours',`<p>The Occupational Safety and Health Standards Law (Republic Act No. 11058) requires every employer to give workers a safe and healthy workplace, and requires workers to follow safety rules. Tito Solutions keeps its offices safe through regular inspections, fire and earthquake drills, first-aid trained staff, and an OSH committee that includes employee representatives.</p>`,['advisory','Department Order on OSH','Occupational Safety and Health','Sample of a DOLE department order. Illustration only.']],['What you should do',`<ul><li>Follow safety signs, evacuation routes, and instructions during drills.</li><li>Report hazards, near misses, and accidents to your supervisor or the OSH officer immediately.</li><li>Use protective equipment when your task needs it.</li><li>Keep walkways, exits, and fire equipment clear.</li></ul>`],['The right to refuse unsafe work',`<p>Workers have the right to refuse work when there is an imminent danger to life or health and to leave the area, without losing pay or being penalized. Tell your supervisor why. The company will look into the hazard and fix it before work continues.</p>`]],
'POL-008':[['A safe, drug-free workplace',`<p>The Comprehensive Dangerous Drugs Act of 2002 (Republic Act No. 9165) requires employers to keep the workplace free from illegal drugs. This policy prohibits the use, possession, sale, or distribution of illegal drugs on company premises or during work, and working while under the influence.</p>`,['form','Drug-free workplace','Sample acknowledgment form','Sample of an acknowledgment form. Illustration only.']],['Testing',`<p>Drug testing is limited to what the law allows, such as testing done as part of employment requirements or when there is reasonable ground to suspect impairment at work. Tests are done by accredited facilities, and results are shared only with the people who need them.</p>`],['Help is available',`<p>An employee who asks for help with substance use will be treated with respect and referred to a government-accredited rehabilitation program. Seeking help early is encouraged and handled confidentially.</p>`]],
'POL-009':[['Non-discrimination',`<p>The Philippine HIV and AIDS Policy Act (Republic Act No. 11166) protects the rights of people living with HIV. Under this policy, HIV status is not a ground to refuse employment, to deny a promotion, or to end employment. The company does not require an HIV test as a condition of hiring or continued work.</p>`,['law','REPUBLIC ACT NO. 11166','Philippine HIV and AIDS Policy Act','Sample of the first page of a Republic Act. Illustration only.']],['Confidentiality',`<p>Health information, including HIV status, is strictly confidential. It is disclosed only as the law permits and only to the people who must have it. Sharing someone’s health information without proper authority is a serious violation of this policy and of the Data Privacy Act.</p>`],['Education and support',`<p>Tito Solutions provides information about HIV prevention and care, and encourages employees to seek testing and treatment through accredited health providers. Employees who need time for treatment can use their leave benefits.</p>`]],
'POL-010':[['Why mental health matters at work',`<p>The Mental Health Act (Republic Act No. 11036) and guidance from the Department of Labor and Employment encourage employers to look after mental well-being. Stress, burnout, anxiety, and depression are common, and they are treatable. This policy aims to make it safe to ask for help and to remove stigma.</p>`,['memo','Mental health at work','','Sample of a company memorandum on mental health. Illustration only.']],['Support available',`<ul><li>The Employee Assistance Program offers confidential counseling.</li><li>Managers are trained to notice signs of distress and to refer, not to diagnose.</li><li>Flexible arrangements, where possible, help employees through difficult periods.</li></ul>`],['Confidentiality',`<p>Requests for support are confidential. Information is shared only with the employee’s consent, or where the law requires it, for example to prevent serious harm.</p>`]],
'POL-011':[['Equal treatment',`<p>Tito Solutions treats every applicant and employee fairly in hiring, pay, promotion, training, and discipline. The Magna Carta of Women (Republic Act No. 9710) requires equal opportunity for women, and the Anti-Age Discrimination in Employment Act (Republic Act No. 10911) prohibits age limits in hiring and promotion. This policy also covers sex, civil status, religion, disability, and other grounds.</p>`,['law','REPUBLIC ACT NO. 9710','Magna Carta of Women','Sample of the first page of a Republic Act. Illustration only.']],['Reasonable accommodation',`<p>Employees with disabilities, and employees who are pregnant or nursing, can ask for reasonable changes that help them do their work. Talk to Human Resources. The company will work with you to find a practical arrangement.</p>`],['If you experience or see discrimination',`<p>Raise it with Human Resources or file a report in T201. Concerns are looked into promptly, and no one is punished for raising one in good faith.</p>`]],
'POL-012':[['Statutory leaves',`<p>Besides regular leave, the law gives employees specific leave rights. This policy explains four of them and how to file each in T201.</p><ul><li><b>Maternity leave:</b> 105 days of paid leave under the Expanded Maternity Leave Law (Republic Act No. 11210), with an option to extend by 30 days without pay. Solo parents may get an additional 15 days.</li><li><b>Paternity leave:</b> 7 days for married male employees (Republic Act No. 8187).</li><li><b>Solo parent leave:</b> 7 days a year for qualified solo parents under the Expanded Solo Parents Welfare Act (Republic Act No. 11861).</li><li><b>Leave for victims of violence against women and their children:</b> up to 10 days of paid leave under Republic Act No. 9262, with the documents the law requires.</li></ul>`,['form','Leave application','Sample leave form','Sample of a leave application form. Illustration only.']],['How to file',`<p>File the leave in T201 under <b>Leaves</b>, choose the type, and attach the documents. Medical and civil documents are kept confidential and are visible only to the people who approve the leave. File as early as you can so that your team can plan.</p>`],['Return to work',`<p>When you return, your supervisor will agree with you on handover and any adjustments. Your position and benefits are protected as the law provides.</p>`]],
'POL-013':[['Speaking up is protected',`<p>Tito Solutions wants to hear about wrongdoing early. This policy protects any employee who reports, in good faith, a violation of law, a violation of company policy, or a risk to health, safety, or the company’s finances. It also protects witnesses and people who help with an investigation.</p>`,['memo','Whistleblower protection','','Sample of a company memorandum on non-retaliation. Illustration only.']],['How to report',`<p>Use <b>Report an Incident</b> in T201. You may ask that your name be hidden from receivers other than Compliance &amp; Legal. You may also report to Human Resources or to any member of senior management. If the report concerns a member of Compliance &amp; Legal, that person does not see it.</p>`],['What retaliation means',`<p>Retaliation includes dismissal, demotion, a worse schedule or assignment, exclusion from meetings, threats, or any other treatment meant to punish a report. It is itself a violation of this policy and can be reported the same way. A report that turns out unsubstantiated is not punished. Knowingly false reports are.</p>`]],
'MEMO-2026-015':[['What this memo covers',`<p>This memo reminds everyone how pay is computed on holidays this December. The rules follow the Labor Code and the yearly presidential proclamation of regular holidays and special non-working days. Your payslip will show the computation for each holiday you work or take.</p>`,['advisory','Proclamation on holidays','Regular and special non-working days','Sample of a holiday proclamation. Illustration only.']],['Pay rules',`<ul><li><b>Regular holidays:</b> you are paid 100% of your daily rate even if you do not work. If you work, you are paid 200%.</li><li><b>Special non-working days:</b> “no work, no pay” applies if you do not work. If you work, you are paid 130%.</li><li><b>Rest day that falls on a holiday:</b> higher rates apply, as the law provides. Ask HR to confirm your case.</li><li><b>Overtime on a holiday:</b> an additional rate applies to the extra hours.</li></ul>`],['What to do',`<p>Check your schedule in T201 and file any leave or swap request at least five working days before the holiday. If you are scheduled to work, confirm the date and time with your supervisor. Questions about your computation go to Human Resources.</p>`]],
'MEMO-2026-014':[['Why this channel is new',`<p>Until now, workplace incidents were reported by email or in person, which made it hard to keep reports confidential or to show later that each one was handled fairly. Employees can now report in T201, and reports go straight to Compliance &amp; Legal in a controlled space.</p>`,['memo','Incident reporting channel','','Sample of a company memorandum announcing the channel. Illustration only.']],['How to report',`<p>Open <b>Report an Incident</b> under Incidents. Tell us what happened, who was involved, and any witnesses, and attach files or links if you have them. You may add receivers and ask that your name be hidden from receivers other than Compliance &amp; Legal. If anyone is in immediate danger, call building security first and then file the report.</p>`],['What happens next',`<p>Compliance &amp; Legal reviews your report, may contact you for more details, and decides what steps to take. You can follow its status in <b>My Reports</b>. The people you name are not told about the report unless Compliance &amp; Legal contacts them as part of a review.</p>`],['Protection',`<p>No employee may be punished or treated differently for reporting in good faith. Retaliation is itself a reportable offense.</p>`]],
'MEMO-2026-012':[['When work is suspended',`<p>When the government suspends work in the private sector because of a typhoon or other calamity, attendance is not required. Pay for the day follows the Department of Labor and Employment advisory issued for that event, so the rule can differ from one event to the next. Human Resources posts the applicable rule in T201 after each announcement.</p>`,['advisory','Labor Advisory on typhoons','Work during calamities','Sample of a DOLE labor advisory. Illustration only.']],['Staying safe',`<ul><li>Do not travel if your area is under a storm signal or flooding.</li><li>Move to a safe place and keep your phone charged.</li><li>Tell your supervisor through T201 Messages as soon as it is safe to do so.</li><li>Follow official advisories from PAGASA and your local government.</li></ul>`],['Working from home',`<p>Where the job allows it and the connection is safe, supervisors may ask for work from home instead of a full day off. Time worked is recorded in T201, and approved hours are paid.</p>`]]};
POL.forEach(p=>{if(LONG[p.id])p.secs=LONG[p.id]});

{id:'REL-2026-009',title:'Incident Reporting is now in T201',ver:'v1.6.0',date:'2026-10-12',cat:'New feature',module:'Incident Reporting',by:'Product Team',aud:'All employees',summary:'Employees can now report a workplace incident in T201 in confidence, and Compliance & Legal can handle each case from intake to closure in one place.',
 secs:[['What is new',`<p>Until now, workplace incidents were reported by email or in person. That made it hard to keep reports confidential and to show later that each one was handled fairly. From this release, every employee has a trusted, in-system channel, and Compliance &amp; Legal (C&amp;L) has a complete workspace for each case.</p><ul><li><b>Report an Incident:</b> a simple form with what happened, the people involved, witnesses, and files or links.</li><li><b>Who receives this:</b> Compliance &amp; Legal always receives the report. You can add other receivers and ask that your name be hidden from receivers other than C&amp;L.</li><li><b>My Reports:</b> follow the status of your report (Received, Under Review, Closed) without exposing details of the review.</li><li><b>My Notices:</b> if you are named in a report, you receive a Notice to Explain here and can respond in writing.</li><li><b>Policies link:</b> pick the policy your concern falls under straight from the form.</li></ul>`,['ui','Report an Incident','form','The Report an Incident form. Illustration only.']],
 ['How to report an incident',`<ol><li>Open <b>Incidents &gt; Report an Incident</b> in the sidebar.</li><li>Say when and where it happened, and write what happened in your own words.</li><li>Optional: press <b>View Policies</b> to choose the policy concerned. You return to the form with everything you typed still in place.</li><li>Under <b>People</b>, search for the people involved and any witnesses.</li><li>Answer <b>Is anyone in immediate danger?</b> If yes, the report is marked urgent and C&amp;L is alerted right away.</li><li>Add other receivers if you wish, and turn on <b>Keep my identity hidden from receivers</b> if you want it.</li><li>Attach files or links, then press <b>Submit report</b>.</li></ol>`],
 ['What happens after you report',`<p>Compliance &amp; Legal reviews your report and may contact you for more details. The people you name are not told about the report unless C&amp;L contacts them as part of a review. You can follow your report under <b>My Reports</b>. When the case is closed, you receive a message. No employee may be punished or treated differently for reporting in good faith.</p>`],
 ['For Compliance & Legal and receivers',`<p>The Case Inbox lists every case you can see, with colored dots that show which ones need your action and which are waiting for an employee. Each case opens in a workspace with the case header, a Next Action card, and a progress bar that stay on every tab.</p><ul><li><b>Allegations &amp; Findings</b> and <b>Evidence</b> keep files, links, and previews in one place.</li><li><b>Interviews &amp; Notes</b> and <b>Interim Measures</b> record what was done and when.</li><li><b>Issue NTE</b> opens an Edit and Preview modal. The deadline is checked against the minimum response period.</li><li>A disciplinary decision needs an NTE that was answered or lapsed. A case can close only when its checklist is complete.</li></ul>`,['ui','Case workspace','cases','The case workspace with the Next Action card and progress. Illustration only.']],
 ['Good to know',`<p>Case access is per case, not by T201 role. Even a Super Admin has no access unless added to the case, and any attempt is recorded in the case activity log. An open case does not appear on the 201 file of the people involved. Email and chat reminders are planned for a later release.</p>`]],
 files:[{n:'T201_Incident_Case_Management_FRD_v0_2.pdf',k:'FRD',sz:'1.4 MB'},{n:'Incident_Reporting_User_Guide.pdf',k:'Guide',sz:'820 KB'}]},
{id:'REL-2026-008',title:'Policies & Memoranda: read and acknowledge in one place',ver:'v1.5.2',date:'2026-10-10',cat:'New feature',module:'Policies',by:'Product Team',aud:'All employees',summary:'Every company policy and memorandum now lives in a Policies tab, and each one asks you to read and acknowledge it.',
 secs:[['What is new',`<p>The new <b>Policies</b> tab holds all company policies and memoranda, not only the ones about conduct. Each item shows its legal basis, effective date, and sections, and some include a sample document. Authorized personnel can roll out a new policy or memo, and every employee is asked to acknowledge it.</p><ul><li>A count on the sidebar shows how many items still need your acknowledgment.</li><li>New items appear in <b>Announcements</b> on your dashboard.</li><li>The report form links to the policy list so you can find the policy that applies.</li></ul>`,['ui','Policies','list','The Policies list. Illustration only.']],
 ['How to acknowledge',`<ol><li>Open <b>Policies</b> in the sidebar, or press <b>Read &amp; acknowledge</b> on your dashboard.</li><li>Open an item and read it. You can view or download the attached PDF.</li><li>On the right, tick <b>I have read and understood</b>.</li><li>Press <b>Acknowledge</b>. Your acknowledgment is saved with the version and the time.</li></ol>`],
 ['For publishers',`<p>Use <b>Roll out policy or memo</b> to publish. Open any item to see who has acknowledged and who is still pending.</p>`]],

{id:'REL-2026-007',title:'A new dashboard for everyone',ver:'v1.5.0',date:'2026-10-08',cat:'Improvement',module:'Dashboard',by:'Product Team',aud:'All employees',summary:'The dashboard now adapts to your role. Employees see upcoming events, birthdays, and milestones. Authorized personnel also see an HR overview.',
 secs:[['What changed',`<p>Employees see Contract Milestones, Upcoming Events, Upcoming Birthdays, and Work Anniversaries. Roles with more capabilities, such as Super Admin, also see an HR Overview with headcount cards and a department breakdown. Use the 30, 60, and 90 day buttons to change the window.</p>`,['ui','Dashboard','cards','The new dashboard. Illustration only.']],['How to use it',`<ol><li>Open <b>Dashboard</b>.</li><li>Pick a 30, 60, or 90 day window at the top right.</li><li>Check <b>Announcements</b> for new policies and releases that need your acknowledgment.</li></ol>`]],

{id:'REL-2026-006',title:'Employee profiles now show Awards',ver:'v1.4.6',date:'2026-10-05',cat:'New feature',module:'Employees',by:'Product Team',aud:'Authorized personnel',summary:'Authorized personnel can open any employee profile, see their position and department, and view the awards they have earned.',
 secs:[['What is new',`<p>The <b>Employees</b> tab now opens a directory. Select a name to open the profile, which shows position, department, status, awards, and experience. Six badges recognize contributions, from Tito/Tita of the Month to Honeycomb. Select a badge to see its meaning and the dates it was received.</p>`,['ui','Employee profile','profile','An employee profile with awards. Illustration only.']],['Who can use it',`<p>Only Super Admin and other authorized personnel can open profiles. Other employees see the Employees item locked.</p>`]],

{id:'REL-2026-005',title:'Salary History: Phase 2',ver:'v1.4.4',date:'2026-09-28',cat:'Improvement',module:'Salary',by:'Product Team',aud:'Authorized personnel',summary:'The Salary History tab is easier to read, with pagination on the salary records table.',

{id:'REL-2026-004',title:'Leave Management: team requests and holiday exclusion',ver:'v1.4.1',date:'2026-09-20',cat:'New feature',module:'Leaves',by:'Product Team',aud:'All employees',summary:'Managers can see their team’s leave in one view, and leave requests across several dates skip holidays automatically.',
 secs:[['What is new',`<p>Managers get a <b>Team Requests</b> view of leave across their team. When you request leave over several dates, holidays are excluded so you are not charged for days that are already off. You can also pick multiple, non-consecutive dates in one request.</p>`,['ui','Leave Management','cards','Leave requests and balances. Illustration only.']],['How to use it',`<ol><li>Open <b>Leaves</b> and choose <b>File a leave</b>.</li><li>Select your dates. Holidays are skipped automatically.</li><li>Submit. Your manager approves it in Team Requests.</li></ol>`]],

{id:'REL-2026-003',title:'New website: the T201 Help Center',ver:'Web',date:'2026-09-10',cat:'New website',module:'Help Center',by:'Product Team',aud:'All employees',summary:'A new Help Center brings user guides, release notes, and answers to common questions into one searchable site.',

const EVT=[
{id:'EVT-2026-006',title:'Quarterly Town Hall: All Employees Required to Attend',tags:['Pinned','Event'],posted:'2026-10-11',when:'2026-10-29T15:00',where:'Ortigas Office, 3F Training Room, and Microsoft Teams',by:'Human Resources',likes:24,body:`<p>Our quarterly Town Hall is on October 29, 2026, at 3:00 PM. Management will share the Q3 results, upcoming projects, and changes to benefits. There will be a Q&amp;A at the end.</p><p>Attendance is required for all employees. If you cannot attend because of a client commitment, tell your supervisor in advance and watch the recording afterward.</p><ul><li>Q3 business update</li><li>New releases in T201, including Incident Reporting and Policies</li><li>Open forum</li></ul>`,cm:[['Maria Santos','Oct 11, 2026','Can we submit questions beforehand?'],['Human Resources','Oct 11, 2026','Yes. Send them to HR by Oct 27.']]},
{id:'EVT-2026-005',title:'Fire and Earthquake Drill on October 21',tags:['Urgent','Advisory'],posted:'2026-10-10',when:'2026-10-21T10:00',where:'All floors, Ortigas Office',by:'Operations',likes:45,body:`<p>A fire and earthquake drill will take place on October 21, 2026, at 10:00 AM. When the alarm sounds, stop work, take your valuables, and follow your floor marshal to the assembly area at the ground-floor parking.</p><p>Participation is mandatory for everyone in the office. Remote employees do not need to take part.</p>`,cm:[['Mark Tan','Oct 10, 2026','Floor marshals, please check in with Operations on Oct 20.']]},
{id:'EVT-2026-004',title:'Scheduled Power Interruption in the Ortigas Office, October 19',tags:['Urgent','Advisory'],posted:'2026-10-09',when:'2026-10-19T08:00',where:'Ortigas Office',by:'Operations',likes:18,body:`<p>The building will have a scheduled power interruption on October 19, 2026, from 8:00 AM to 12:00 noon. Please work from home that morning, or come in after 1:00 PM. Save your work and shut down desktops on Friday evening.</p>`,cm:[]},
{id:'EVT-2026-003',title:'Wellness Week, October 26 to 30',tags:['Event'],posted:'2026-10-07',when:'2026-10-26T09:00',where:'Ortigas Office and Microsoft Teams',by:'Human Resources',likes:62,body:`<p>Join our Wellness Week. Sessions include stress management with the Employee Assistance Program, a lunchtime stretching class, and a talk on healthy sleep. Sign up for any session you like. Free healthy snacks are provided on-site.</p>`,cm:[['Rina Alvarez','Oct 8, 2026','The stretching class was great last year!']]},
{id:'EVT-2026-002',title:'Year-End Party: Save the Date, December 12',tags:['Event'],posted:'2026-10-05',when:'2026-12-12T18:00',where:'To be announced',by:'Human Resources',likes:88,body:`<p>Mark your calendars. The year-end party is on Saturday, December 12, 2026, at 6:00 PM. Details about the venue, program, and dress code will follow. Employees may bring one guest.</p>`,cm:[]},
{id:'EVT-2026-001',title:'Updated Office Access Hours Effective November 3',tags:['Policy','Advisory'],posted:'2026-10-02',when:'2026-11-03T07:00',where:'Ortigas Office',by:'Operations',likes:19,body:`<p>Starting November 3, 2026, the Ortigas office is open from 7:00 AM to 9:00 PM on weekdays. Access outside these hours needs approval from your supervisor and Operations. Weekend access requires a request filed in T201 at least one day ahead.</p>`,cm:[]},
{id:'EVT-2026-007',title:'Community Clean-Up Drive on November 14',tags:['Event'],posted:'2026-09-30',when:'2026-11-14T07:00',where:'Meet at the main lobby',by:'Human Resources',likes:41,body:`<p>Join our quarterly community clean-up on November 14, 2026, at 7:00 AM. Breakfast is provided for all volunteers. Bring your own gloves.</p>`,cm:[]}];
